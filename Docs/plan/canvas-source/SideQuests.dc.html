<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const GH = 'https://github.com/bhargavm-iiits/';
    const icons = ['/_blob/05bba2b1b42dc76287d9c549d6b4688e', '/_blob/8352f8a7b6aa2f4b0a658127651d458b', '/_blob/bef40cf95d9af16fc66be5dd6f8457aa', '/_blob/0ce0766e80813b45e779e334f56f7959', '/_blob/7911f2844bf425d4151f0ca4b5302b85', '/_blob/ab409cc20e0bf35d5f71b3d564b7f2bc', '/_blob/a0ea97ef8be9540e8871b1823d141201', '/_blob/05bba2b1b42dc76287d9c549d6b4688e'];
    const data = [
      { title: 'OpthaMiss', kind: 'AI tele-ophthalmology', cat: 'AI/ML', stack: 'React · PyTorch · ViT · FastAPI', note: 'AUC-ROC 0.98', source: GH + 'OpthaMiss_V1' },
      { title: 'Vox-Align', kind: 'Multimodal emotional desktop agent', cat: 'AI/ML', stack: 'Gemini RAG · ChromaDB · BERT · Python', note: 'PyInstaller build', source: GH + 'Vox-Align' },
      { title: 'Privacy-Preserving-RAG', kind: 'Privacy-bounded Gen-AI retrieval with anonymisation', cat: 'AI/ML', stack: 'Python · LLMs · RAG', note: '', source: GH + 'Privacy-Preserving-RAG' },
      { title: 'Hate-Speech-Detection', kind: 'Multimodal abuse filter', cat: 'AI/ML', stack: 'CLIP · LoRA · EasyOCR', note: '', source: GH + 'Hate-Speech-Detection' },
      { title: 'AI-Plant-Disease-Detection', kind: '13-class classifier', cat: 'AI/ML', stack: 'PyTorch · MobileNetV2 · Flask', note: '', source: GH + 'AI-Plant-Disease-Detection' },
      { title: 'Jarvis', kind: 'Voice assistant', cat: 'AI/ML', stack: 'Python · SpeechRecognition · pyttsx3', note: '', source: GH + 'Jarvis' },
      { title: 'E-Portfolio', kind: 'This site', cat: 'WEB', stack: 'Next.js · React Three Fiber · TypeScript', note: 'LIVE', source: GH + 'E-Portfolio' },
      { title: 'More on GitHub', kind: 'Every repository, including the mission sources', cat: 'ARCHIVE', stack: 'github.com/bhargavm-iiits', note: '', source: 'https://github.com/bhargavm-iiits' },
    ];
    const quests = data.map((d, i) => {
      const light = i % 3 === 0;
      const hover = i === 1;
      const css = light
        ? 'border: 1px solid rgba(220,230,255,.45); background: linear-gradient(160deg, rgba(190,200,240,.28), rgba(110,120,190,.18)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 20px 50px rgba(0,0,0,.35)'
        : 'border: 1px solid ' + (hover ? 'rgba(97,226,235,.85)' : 'rgba(150,200,240,.28)') + '; background: rgba(16,24,44,.66); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), ' + (hover ? '0 0 0 1px rgba(97,226,235,.6), 0 12px 40px rgba(97,226,235,.25); transform: translateY(-4px)' : '0 20px 50px rgba(0,0,0,.4)');
      return Object.assign({}, d, { css, icon: icons[i], kc: d.cat === 'WEB' ? '#61E2EB' : d.cat === 'ARCHIVE' ? '#A5BFD3' : '#B9A6FF' });
    });
    let s = 41; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const stars = [];
    for (let i = 0; i < 100; i++) { const size = r() < 0.85 ? 1 + r() * 1.3 : 2 + r() * 2; stars.push({ css: 'left: ' + Math.round(r() * 1280) + 'px; top: ' + Math.round(r() * 720) + 'px; width: ' + size.toFixed(1) + 'px; height: ' + size.toFixed(1) + 'px; opacity: ' + (0.35 + r() * 0.6).toFixed(2) }); }
    return { quests, stars };
  }
}
</script>
