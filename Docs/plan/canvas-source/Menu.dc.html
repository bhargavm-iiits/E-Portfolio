<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VR Main Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Oxanium:wght@700&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0;background:#0C1026}
a{color:#E6ECF5;text-decoration:none}a:hover{color:#ffffff}
a:focus-visible{outline:2px solid #61E2EB;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: linear-gradient(118deg, #0a0e24 0%, #121838 38%, #1d1a4a 66%, #33246a 100%); font-family: 'Chakra Petch', sans-serif; color: #E6ECF5">
  <div style="position: absolute; left: 700px; top: -120px; width: 760px; height: 620px; background: radial-gradient(ellipse at 60% 40%, rgba(110,70,210,.42), rgba(58,42,110,.18) 45%, rgba(0,0,0,0) 72%)"></div>
  <div style="position: absolute; left: -120px; top: 380px; width: 560px; height: 420px; background: radial-gradient(ellipse at 40% 50%, rgba(60,80,190,.25), rgba(0,0,0,0) 70%)"></div>
  <sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
    <div style="position: absolute; border-radius: 50%; background: #ffffff; {{s.css}}"></div>
  </sc-for>
  <img src="/_blob/05bba2b1b42dc76287d9c549d6b4688e" alt="" style="position: absolute; left: -30px; top: 6px; width: 150px; opacity: .85">
  <img src="/_blob/bef40cf95d9af16fc66be5dd6f8457aa" alt="" style="position: absolute; left: 1120px; top: 20px; width: 190px; opacity: .9">
  <img src="/_blob/7911f2844bf425d4151f0ca4b5302b85" alt="" style="position: absolute; left: 310px; top: 300px; width: 128px; opacity: .7">
  <img src="/_blob/05bba2b1b42dc76287d9c549d6b4688e" alt="" style="position: absolute; left: -40px; top: 470px; width: 210px; opacity: .8">
  <img src="/_blob/bef40cf95d9af16fc66be5dd6f8457aa" alt="" style="position: absolute; left: 392px; top: 572px; width: 92px; opacity: .8">
  <img src="/_blob/7911f2844bf425d4151f0ca4b5302b85" alt="" style="position: absolute; left: 1160px; top: 290px; width: 66px; opacity: .8">
  <img src="/_blob/05bba2b1b42dc76287d9c549d6b4688e" alt="" style="position: absolute; left: 1080px; top: 404px; width: 96px; opacity: .8">
  <img src="/_blob/bef40cf95d9af16fc66be5dd6f8457aa" alt="" style="position: absolute; left: 890px; top: 10px; width: 84px; opacity: .75">
  <img src="/_blob/7911f2844bf425d4151f0ca4b5302b85" alt="" style="position: absolute; left: 1080px; top: 0; width: 70px; opacity: .6">

  <sc-for list="{{links}}" as="c" hint-placeholder-count="0">
    <div style="position: absolute; height: 1px; transform-origin: 0 50%; {{c.css}}"></div>
  </sc-for>

  <svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" style="position: absolute; left: 0; top: 0">
    <defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs>
    <g fill="none" stroke="#61E2EB" filter="url(#glow)">
      <circle cx="632" cy="350" r="104" stroke-width="1.3" stroke-opacity=".75"></circle>
      <circle cx="632" cy="350" r="128" stroke-width="2.4" stroke-opacity=".85" stroke-dasharray="150 50 90 60 120 334" transform="rotate(-20 632 350)"></circle>
      <circle cx="632" cy="350" r="141" stroke-width="7" stroke-dasharray="1 8" stroke-opacity=".45"></circle>
      <path d="M556 258 A120 120 0 0 1 600 236" stroke-width="5" stroke-opacity=".9"></path>
      <path d="M708 442 A120 120 0 0 1 664 464" stroke-width="5" stroke-opacity=".9"></path>
    </g>
  </svg>
  <img src="/_blob/a0ea97ef8be9540e8871b1823d141201" alt="" style="position: absolute; left: 576px; top: 290px; width: 112px; filter: drop-shadow(0 0 14px rgba(80,170,255,.8)) drop-shadow(0 0 30px rgba(60,120,255,.45)); transform: {{cubeTurn}}; transition: transform .35s"/>

  <div style="position: absolute; left: 0; right: 0; top: 92px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: .32em; color: #A5BFD3">SELECT YOUR NEXT MISSION</div>

  <nav aria-label="Menu" style="position: absolute; inset: 0">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
      <a href="{{c.href}}" onMouseEnter="{{c.enter}}" onFocus="{{c.enter}}" onMouseLeave="{{leave}}" style="position: absolute; display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; background: linear-gradient(180deg, rgba(22,34,62,.82), rgba(12,20,42,.82)); backdrop-filter: blur(8px); font-family: 'Chakra Petch', sans-serif; font-weight: 700; letter-spacing: .05em; color: #E6ECF5; text-shadow: 0 0 10px rgba(150,200,255,.35); transition: transform .25s, box-shadow .25s, border-color .25s; {{c.css}}">
        <span style="position: absolute; left: -2px; top: -2px; width: 12px; height: 12px; border-left: 2px solid #61E2EB; border-top: 2px solid #61E2EB"></span>
        <span style="position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-right: 2px solid #61E2EB; border-bottom: 2px solid #61E2EB"></span>
        <sc-if value="{{c.contact}}" hint-placeholder-val="{{ false }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6ECF5" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.2" fill="#E6ECF5"></circle></svg>
        </sc-if>
        <span>{{c.label}}</span>
      </a>
    </sc-for>
  </nav>

  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 72% 88% at 50% 44%, rgba(0,0,0,0) 66%, rgba(4,4,14,.82) 92%, rgba(2,2,8,.98) 100%)"></div>
  <svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <path d="M360 720 C 430 640, 520 588, 640 586 C 760 588, 850 640, 920 720 Z" fill="#05050d"></path>
    <path d="M430 720 C 490 650, 560 612, 640 610 C 720 612, 790 650, 850 720" fill="none" stroke="rgba(120,140,220,.18)" stroke-width="2"></path>
  </svg>
  <div style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .2em; color: #8f9cc0; pointer-events: none">HOVER A CHIP · CLICK TO TRAVEL</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hover: 'projects' }; }
  renderVals() {
    const hover = this.state.hover;
    const C = { x: 632, y: 350 };
    const defs = [
      { id: 'xr', label: 'XR / VR / AR', x: 290, y: 190, w: 262, h: 60, fs: 26, rot: 'rotateY(16deg) rotateZ(4deg)', href: 'Vault.dc.html' },
      { id: 'game', label: 'GAME DESIGN', x: 258, y: 357, w: 268, h: 60, fs: 26, rot: 'rotateY(16deg)', href: 'Vault.dc.html' },
      { id: 'sim', label: '3D & SIMULATION', x: 345, y: 490, w: 250, h: 54, fs: 23, rot: 'rotateY(16deg) rotateZ(-6deg)', href: 'Vault.dc.html' },
      { id: 'projects', label: 'PROJECTS', x: 920, y: 232, w: 196, h: 56, fs: 25, rot: 'rotateY(-16deg) rotateZ(-5deg)', href: 'Lab.dc.html' },
      { id: 'experience', label: 'EXPERIENCE', x: 990, y: 358, w: 236, h: 58, fs: 25, rot: 'rotateY(-16deg)', href: 'PlayerLog.dc.html' },
      { id: 'about', label: 'ABOUT', x: 905, y: 492, w: 190, h: 56, fs: 25, rot: 'rotateY(-16deg) rotateZ(5deg)', href: 'PlayerLog.dc.html' },
      { id: 'contact', label: 'CONTACT', x: 638, y: 550, w: 206, h: 44, fs: 17, rot: 'none', href: 'Comms.dc.html', contact: true },
    ];
    const chips = defs.map((d) => {
      const on = hover === d.id;
      const css = 'left: ' + (d.x - d.w / 2) + 'px; top: ' + (d.y - d.h / 2) + 'px; width: ' + d.w + 'px; height: ' + d.h + 'px; font-size: ' + d.fs + 'px; border: 1px solid rgba(112,163,207,' + (on ? '.85' : '.35') + '); transform: perspective(900px) ' + d.rot + (on ? ' translateY(-4px)' : '') + '; box-shadow: ' + (on ? '0 0 0 1px rgba(97,226,235,.6), 0 12px 40px rgba(97,226,235,.25)' : '0 10px 30px rgba(0,0,0,.35)');
      return { label: d.label, href: d.href, contact: !!d.contact, css, enter: () => this.setState({ hover: d.id }) };
    });
    const links = defs.map((d) => {
      const dx = d.x - C.x, dy = d.y - C.y, dist = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
      const start = 146, end = dist - (d.w / 2) * Math.abs(Math.cos(a)) - (d.h / 2) * Math.abs(Math.sin(a)) - 8;
      const on = hover === d.id;
      return { css: 'left: ' + (C.x + Math.cos(a) * start).toFixed(1) + 'px; top: ' + (C.y + Math.sin(a) * start).toFixed(1) + 'px; width: ' + Math.max(0, end - start).toFixed(1) + 'px; transform: rotate(' + (a * 180 / Math.PI).toFixed(2) + 'deg); background: ' + (on ? '#61E2EB' : 'rgba(120,170,220,.45)') + '; box-shadow: ' + (on ? '0 0 8px #61E2EB' : 'none') };
    });
    const cur = defs.find((d) => d.id === hover);
    const yaw = cur ? Math.max(-25, Math.min(25, (cur.x - C.x) / 14)) : 0;
    const cubeTurn = 'perspective(600px) rotateY(' + yaw.toFixed(1) + 'deg)';
    let s = 11; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const stars = [];
    for (let i = 0; i < 110; i++) { const z = r(); const size = z < 0.85 ? 1 + r() * 1.2 : 2 + r() * 2.2; stars.push({ css: 'left: ' + Math.round(r() * 1280) + 'px; top: ' + Math.round(r() * 720) + 'px; width: ' + size.toFixed(1) + 'px; height: ' + size.toFixed(1) + 'px; opacity: ' + (0.35 + r() * 0.6).toFixed(2) + (size > 2 ? '; filter: blur(.6px); box-shadow: 0 0 6px #fff' : '') }); }
    return { chips, links, cubeTurn, stars, leave: () => {} };
  }
}
</script>
</body>
</html>
