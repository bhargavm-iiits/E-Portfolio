<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const M = [
      { tag: 'Game-based learning', title: 'Game-Based Physics Learning', stack: 'Unity • C# • Game design', summary: 'Straight-line kinematics taught through play instead of formulas.', img: '/_blob/57c5d83143e29d845810d978a9e62113', alt: 'Illustrative 3D render of the physics lab', h: 'Core mechanic', text: 'Interactive scenes let learners manipulate velocity, displacement and time to build physical intuition.', href: 'Lab.dc.html' },
      { tag: 'AR navigation', title: 'Tirumala AR Navigation', stack: 'Unity 6 • AR Foundation • ARCore', summary: 'Offline augmented-reality guidance for pilgrims on the Alipiri steps route to Tirumala.', img: '/_blob/23f7413a6498ac6ad6dff367bcfc881f', alt: 'Illustrative 3D render of the terrain and route', h: 'Challenge', text: 'Works with no internet after setup; 1.17 km of the route is missing from OpenStreetMap.', href: 'Terrain.dc.html' },
      { tag: 'Immersive media', title: 'VR Cinema Platform', stack: 'React Three Fiber • Three.js • Python', summary: 'A secure, immersive VR cinema for streamed media: 360° playback and stereoscopic 3D.', img: '/_blob/f13081d4da7f436b6e8b88230c8a63dd', alt: 'Illustrative 3D render of the cinema dome', h: 'Core mechanic', text: '360° spherical video playback and stereoscopic side-by-side 3D.', href: 'Cinema.dc.html' },
      { tag: '3D simulation', title: 'ISRO Launch Pad Simulation', stack: 'Blender • Unreal Engine • 3D simulation', summary: 'Launch-pad simulation from the ISRO project line.', img: '/_blob/9f29054390c6022bbf6ff4702658917a', alt: 'Illustrative 3D render of the launch hangar', h: 'Context', text: 'Built during the IIIT Sri City summer internship (ISRO project line).', href: 'Hangar.dc.html' },
    ];
    const i = this.state.i, n = M.length;
    const go = (k) => this.setState({ i: (k + n) % n });
    const dots = M.map((m, k) => ({ label: m.title, sel: k === i ? 'true' : 'false', go: () => go(k), css: k === i ? 'background: #1F2848' : 'border: 1.5px solid #8890a8' }));
    return {
      m: M[i], counter: 'Mission ' + (i + 1) + ' / ' + n,
      prevTitle: M[(i - 1 + n) % n].title, nextTitle: M[(i + 1) % n].title, nextTag: M[(i + 1) % n].tag,
      prev: () => go(i - 1), next: () => go(i + 1), dots,
    };
  }
}
</script>
