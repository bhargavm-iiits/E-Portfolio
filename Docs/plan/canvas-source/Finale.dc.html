<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 53; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const stars = [];
    for (let i = 0; i < 120; i++) { const big = r() > 0.9; const size = big ? 2.4 + r() * 2.6 : 1 + r() * 1.3; stars.push({ css: 'left: ' + Math.round(r() * 1280) + 'px; top: ' + Math.round(r() * 720) + 'px; width: ' + size.toFixed(1) + 'px; height: ' + size.toFixed(1) + 'px; opacity: ' + (big ? 0.25 + r() * 0.3 : 0.35 + r() * 0.55).toFixed(2) + (big ? '; filter: blur(1.2px)' : '') }); }
    return { stars };
  }
}
</script>
