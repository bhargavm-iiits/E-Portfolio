<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 7;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const bokeh = [];
    for (let i = 0; i < 64; i++) {
      const size = 2 + Math.pow(r(), 2.4) * 24;
      const col = r() < 0.58 ? '97,226,235' : '227,116,188';
      const blur = size > 10 ? (size / 5).toFixed(1) : '0';
      const op = (0.35 + r() * 0.55).toFixed(2);
      const x = Math.round(r() * 1280), y = Math.round(r() * 720);
      bokeh.push({ css: 'left: ' + x + 'px; top: ' + y + 'px; width: ' + size.toFixed(1) + 'px; height: ' + size.toFixed(1) + 'px; background: rgba(' + col + ',' + op + '); filter: blur(' + blur + 'px); box-shadow: 0 0 ' + Math.round(size) + 'px rgba(' + col + ',.55)' });
    }
    return { bokeh };
  }
}
